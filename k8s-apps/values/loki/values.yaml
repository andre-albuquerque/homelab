# Configuração mínima para Loki - Homelab
# Single binary mode para economizar recursos
# Armazenamento S3 compatível (MinIO)

global:
  dnsService: coredns

memberlist:
  service:
    publishNotReadyAddresses: true

loki:
  auth_enabled: false
  extraMemberlistConfig:
    abort_if_cluster_join_fails: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: loki_index_
        period: 24h
  pattern_ingester:
    enabled: false
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    max_streams_per_user: 0
    max_global_streams_per_user: 0
    ingestion_rate_mb: 4
    ingestion_burst_size_mb: 8
    max_line_size: 256kb
    max_line_size_truncate: true
  server:
    grpc_server_max_concurrent_streams: 50
    log_level: info
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 15
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 10
  ruler:
    enable_api: false
  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin
    s3:
      endpoint: minio.minio.svc.cluster.local:9000
      region: us-east-1
      accessKeyId: minioadmin
      secretAccessKey: minioadmin
      s3ForcePathStyle: true
      insecure: true

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

test:
  enabled: false

minio:
  enabled: false

deploymentMode: Monolithic

chunksCache:
  enabled: false
  
resultsCache:
  enabled: false

singleBinary:
  replicas: 1
  sidecar: false
  # Recursos mínimos configurados
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  persistence:
    enabled: true
    size: 5Gi
    storageClass: longhorn

backend:
  replicas: 0
  
read:
  replicas: 0
  
write:
  replicas: 0

ingester:
  replicas: 0
  
querier:
  replicas: 0
  
queryFrontend:
  replicas: 0
  
queryScheduler:
  replicas: 0
  
distributor:
  replicas: 0
  
compactor:
  replicas: 0
  
indexGateway:
  replicas: 0
  
bloomPlanner:
  replicas: 0
  
bloomBuilder:
  replicas: 0
  bloomGateway:
    replicas: 0

canary:
  enabled: false

# Gateway desabilitado para economizar recursos
gateway:
  enabled: false
  replicas: 0

# Configuração de retention para economizar espaço
retention:
  enabled: true
  period: 7d